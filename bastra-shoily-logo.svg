<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="100%" height="100%" fill="none">
  <defs>
    <!-- Royal Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEB853" />
      <stop offset="30%" stop-color="#C59B27" />
      <stop offset="70%" stop-color="#A57A18" />
      <stop offset="100%" stop-color="#D9AB36" />
    </linearGradient>

    <!-- Deep Navy Gradient -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3B60" />
      <stop offset="100%" stop-color="#0F243E" />
    </linearGradient>

    <!-- Soft Golden Glow -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#C59B27" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Left Emblem Group (Crescent + Artisanal Loom Figure) -->
  <g transform="translate(18, 12)">
    <!-- Outer Navy Arc / Crescent Circle -->
    <path d="M 68 8 A 54 54 0 1 0 86 102 C 60 114 26 102 14 74 C 2 46 16 16 48 4 C 54 2 62 4 68 8 Z" fill="url(#navyGrad)" />
    <!-- Golden Head Dot -->
    <circle cx="68" cy="24" r="7" fill="url(#goldGrad)" filter="url(#softGlow)" />
    <!-- Stylized Fold / Figure Swirl (Gold) -->
    <path d="M 68 34 C 64 48 58 66 48 80 C 44 86 38 90 32 92 C 34 82 40 70 48 56 C 54 46 62 38 68 34 Z" fill="url(#goldGrad)" />
    <path d="M 72 38 C 76 56 78 76 74 94 C 70 82 66 66 62 52 C 66 46 70 42 72 38 Z" fill="url(#goldGrad)" />
    <path d="M 76 44 C 84 60 90 76 92 90 C 86 82 80 70 76 56 Z" fill="url(#goldGrad)" opacity="0.9" />
    <!-- Inner Navy Calligraphic Flourish -->
    <path d="M 40 50 C 42 64 36 78 24 88 C 28 80 32 68 34 58 C 36 54 38 52 40 50 Z" fill="#FFFFFF" opacity="0.85" />
    <!-- Elegant Bengali 'ব' ligature inside crescent -->
    <path d="M 38 62 Q 52 50 62 66 Q 50 82 36 78 Z" fill="url(#navyGrad)" opacity="0.95" />
  </g>

  <!-- Main Bengali Typography: "বস্ত্র শৈলী" -->
  <!-- "বস্ত্র" in Deep Navy -->
  <g fill="url(#navyGrad)">
    <!-- Custom elegant stylized Bengali text representation -->
    <text x="145" y="98" font-family="'Hind Siliguri', 'Galada', 'Noto Sans Bengali', 'SolaimanLipi', sans-serif" font-size="74" font-weight="900" letter-spacing="-1.5">
      বস্ত্র
    </text>
  </g>

  <!-- "শৈলী" in Royal Gold with Glow -->
  <g fill="url(#goldGrad)" filter="url(#softGlow)">
    <text x="282" y="98" font-family="'Hind Siliguri', 'Galada', 'Noto Sans Bengali', 'SolaimanLipi', sans-serif" font-size="74" font-weight="900" letter-spacing="-1">
      শৈলী
    </text>
  </g>

  <!-- Ornamental Golden Divider Line with loop curls underneath -->
  <g stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left line -->
    <line x1="145" y1="126" x2="270" y2="126" />
    <!-- Center ornamental filigree motif -->
    <circle cx="282" cy="126" r="2.5" fill="url(#goldGrad)" />
    <path d="M 288 126 C 291 122, 296 122, 299 126 C 302 130, 307 130, 310 126" />
    <circle cx="316" cy="126" r="2.5" fill="url(#goldGrad)" />
    <!-- Right line -->
    <line x1="328" y1="126" x2="480" y2="126" />
  </g>
</svg>
